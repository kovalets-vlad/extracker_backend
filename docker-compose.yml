version: "3.8"

services:
    db:
        image: postgres:15-alpine
        container_name: extracker_db
        restart: always
        env_file: .env
        ports:
            - "${DB_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 5s
            timeout: 5s
            retries: 5

    api:
        build: .
        container_name: extracker_api
        restart: always
        ports:
            - "8000:8000"
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ./app:/code/app
        env_file: .env
        environment:
            - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}

volumes:
    postgres_data:
